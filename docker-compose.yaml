services:
  postgres:
    image: postgres:16-alpine
    container_name: subscriptions_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meow1234
      POSTGRES_DB: subscriptions_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscriptions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_subscription_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=meow1234
      - DB_NAME=subscriptions_db
    depends_on:
      postgres:
        condition: service_healthy 

volumes:
  pgdata: